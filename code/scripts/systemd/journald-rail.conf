# Install as /etc/systemd/journald.conf.d/rail.conf (requires sudo).
# Without /var/log/journal the Jetson keeps logs only in RAM, so a field fault
# followed by a power cycle leaves nothing to inspect. Keep logs across reboots
# and cap their disk use.
[Journal]
Storage=persistent
SystemMaxUse=200M
MaxRetentionSec=30day
